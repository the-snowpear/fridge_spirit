<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrowWrite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="920" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="800" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">冰箱小精灵 · AI 记忆系统架构</text>
  <text x="800" y="82" text-anchor="middle" font-size="16" fill="#64748b">短期会话记忆 + 长期结构化记忆 · 设备端读写闭环（ESP32-S3 直连 OpenAI-compatible API）</text>

  <!-- ========== 左侧：记忆存储层（焦点） ========== -->
  <g filter="url(#shadow)">
    <rect x="70" y="140" width="580" height="726" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="70" y="140" width="580" height="44" rx="14" fill="#f59e0b"/>
  <rect x="70" y="166" width="580" height="18" fill="#f59e0b"/>
  <text x="92" y="169" font-size="19" font-weight="700" fill="#ffffff">记忆存储层 · storage 组件</text>
  <text x="630" y="168" text-anchor="end" font-size="13" fill="#fff7e6">cache LittleFS · /cache/*.json</text>

  <!-- 短期记忆卡 -->
  <rect x="92" y="206" width="536" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="92" y="206" width="7" height="150" rx="3" fill="#0ea5e9"/>
  <text x="116" y="236" font-size="18" font-weight="700" fill="#0369a1">① 短期会话记忆</text>
  <text x="116" y="263" font-size="14" fill="#334155">文件：/cache/ai_history.json</text>
  <text x="116" y="288" font-size="14" fill="#334155">窗口：48 小时 / 最多 15 轮（30 条消息），到期与超量自动裁剪</text>
  <text x="116" y="313" font-size="14" fill="#334155">用途：连续多轮对话上下文，随请求注入 history 字段</text>
  <text x="116" y="338" font-size="13" fill="#64748b">接口：append_chat_messages() / get_chat_history()</text>

  <!-- 长期记忆卡（核心高亮） -->
  <rect x="92" y="372" width="536" height="208" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="92" y="372" width="7" height="208" rx="3" fill="#f59e0b"/>
  <text x="116" y="402" font-size="18" font-weight="700" fill="#b45309">② 长期结构化记忆（核心）</text>
  <text x="116" y="429" font-size="14" fill="#334155">文件：/cache/memory_summary.json</text>
  <text x="116" y="452" font-size="13.5" fill="#334155">六类白名单字段：</text>
  <!-- 字段标签 -->
  <g font-size="13" fill="#7c2d12">
    <rect x="116" y="462" width="92" height="26" rx="13" fill="#fef3c7"/><text x="162" y="479" text-anchor="middle">family_size</text>
    <rect x="216" y="462" width="64" height="26" rx="13" fill="#fef3c7"/><text x="248" y="479" text-anchor="middle">taste</text>
    <rect x="288" y="462" width="64" height="26" rx="13" fill="#fef3c7"/><text x="320" y="479" text-anchor="middle">avoid</text>
    <rect x="360" y="462" width="84" height="26" rx="13" fill="#fef3c7"/><text x="402" y="479" text-anchor="middle">allergies</text>
    <rect x="116" y="494" width="116" height="26" rx="13" fill="#fef3c7"/><text x="174" y="511" text-anchor="middle">kitchen_tools</text>
    <rect x="240" y="494" width="130" height="26" rx="13" fill="#fef3c7"/><text x="305" y="511" text-anchor="middle">recent_summary</text>
  </g>
  <text x="116" y="546" font-size="13.5" fill="#334155">承载：家庭人数 / 口味 / 忌口 / 过敏 / 常用厨具 / 近期摘要</text>
  <text x="116" y="568" font-size="13" fill="#dc2626" font-weight="600">策略：只存结构化摘要，不存完整聊天；不存 API Key / 密码</text>

  <!-- 其他数据源卡 -->
  <rect x="92" y="596" width="536" height="116" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="92" y="596" width="7" height="116" rx="3" fill="#94a3b8"/>
  <text x="116" y="624" font-size="16" font-weight="700" fill="#475569">同源上下文数据（同一 cache 分区）</text>
  <text x="116" y="650" font-size="13.5" fill="#334155">ui_inventory.json 库存 · reminder_queue.json 提醒</text>
  <text x="116" y="673" font-size="13.5" fill="#334155">user_preferences.json 偏好 · pending_queue.json 离线队列</text>
  <text x="116" y="697" font-size="12.5" fill="#64748b">库存单一来源：屏幕 UI 与 AI 上下文读取同一文件，避免分叉</text>

  <!-- 写策略脚注 -->
  <rect x="92" y="726" width="536" height="124" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="116" y="752" font-size="15" font-weight="700" fill="#b91c1c">记忆写入校验（固件硬边界）</text>
  <text x="116" y="777" font-size="13" fill="#7f1d1d">动作白名单：append / replace / clear</text>
  <text x="116" y="800" font-size="13" fill="#7f1d1d">字段白名单：仅上述六类；family_size 限 0..12</text>
  <text x="116" y="823" font-size="13" fill="#7f1d1d">值按 UTF-8 安全裁剪 ≤ 80 字；总文件 ≤ 1KB</text>
  <text x="116" y="843" font-size="12.5" fill="#991b1b">非法 / 超限只忽略写入，不影响用户可见回复</text>

  <!-- ========== 右侧：请求处理流水线 ========== -->
  <!-- 1 入口层 -->
  <g filter="url(#shadow)">
    <rect x="720" y="140" width="810" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="744" y="172" font-size="18" font-weight="700" fill="#1d4ed8">入口层 · 触发一次 AI 对话</text>
  <g font-size="13.5" fill="#1e3a8a">
    <rect x="744" y="186" width="232" height="42" rx="8" fill="#dbeafe"/>
    <text x="860" y="205" text-anchor="middle">Web 运维面板</text><text x="860" y="222" text-anchor="middle" font-size="12" fill="#3b82f6">USB JSON Lines</text>
    <rect x="990" y="186" width="232" height="42" rx="8" fill="#dbeafe"/>
    <text x="1106" y="205" text-anchor="middle">屏幕 AI 语音页</text><text x="1106" y="222" text-anchor="middle" font-size="12" fill="#3b82f6">page_ai / 语音会话</text>
    <rect x="1236" y="186" width="270" height="42" rx="8" fill="#dbeafe"/>
    <text x="1371" y="205" text-anchor="middle">厨房 AI · kitchen_ai</text><text x="1371" y="222" text-anchor="middle" font-size="12" fill="#3b82f6">菜谱 / 营养自动生成</text>
  </g>

  <!-- 2 上下文编排 -->
  <g filter="url(#shadow)">
    <rect x="720" y="292" width="810" height="124" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  </g>
  <text x="744" y="324" font-size="18" font-weight="700" fill="#0f766e">上下文编排层 · ai_context</text>
  <text x="744" y="350" font-size="13.5" fill="#134e4a">fridge_ai_context_build_preview()：读取记忆并组装最小上下文包</text>
  <g font-size="13" fill="#115e59">
    <rect x="744" y="364" width="170" height="38" rx="8" fill="#ccfbf1"/><text x="829" y="388" text-anchor="middle">固定人格模板</text>
    <rect x="926" y="364" width="190" height="38" rx="8" fill="#ccfbf1"/><text x="1021" y="388" text-anchor="middle">任务模板（按 task_type）</text>
    <rect x="1128" y="364" width="378" height="38" rx="8" fill="#ccfbf1"/><text x="1317" y="388" text-anchor="middle">动态上下文：库存/提醒/偏好/记忆摘要/历史（按需）</text>
  </g>

  <!-- 3 AI 直连 -->
  <g filter="url(#shadow)">
    <rect x="720" y="464" width="810" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="744" y="496" font-size="18" font-weight="700" fill="#6d28d9">设备直连层 · ai_client</text>
  <text x="744" y="522" font-size="13.5" fill="#4c1d95">fridge_ai_client_assistant_chat()：拼装 messages（人格+任务+上下文+history+用户），HTTPS 出网</text>
  <text x="744" y="546" font-size="12.5" fill="#7c3aed">每条 system/context/history/user 文本先做 UTF-8 校验清洗，避免半截多字节触发 400</text>

  <!-- 4 API -->
  <g filter="url(#shadow)">
    <rect x="720" y="612" width="810" height="86" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="744" y="644" font-size="18" font-weight="700" fill="#4338ca">OpenAI-compatible API</text>
  <text x="744" y="671" font-size="13.5" fill="#312e81">POST /chat/completions（默认 SiliconFlow）· 返回 choices[0].message.content</text>

  <!-- 5 写回校验 -->
  <g filter="url(#shadow)">
    <rect x="720" y="746" width="810" height="120" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="744" y="778" font-size="18" font-weight="700" fill="#b91c1c">记忆写回 / 指令剥离 · storage</text>
  <text x="744" y="804" font-size="13.5" fill="#7f1d1d">AI 回复尾部隐藏指令：MEMORY_OP:{"action","key","value","reason"}</text>
  <text x="744" y="828" font-size="13.5" fill="#7f1d1d">apply_memory_directive()：白名单校验 → 写回长期记忆；同时本轮 user/assistant 入短期历史</text>
  <text x="744" y="851" font-size="12.5" fill="#991b1b">剥离 MEMORY_OP 后，仅把干净文本返回给入口（Web 显示 / 屏幕 / TTS）</text>

  <!-- ===== 流水线竖向箭头 ===== -->
  <g stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <line x1="1125" y1="244" x2="1125" y2="290"/>
    <line x1="1125" y1="416" x2="1125" y2="462"/>
    <line x1="1125" y1="564" x2="1125" y2="610"/>
    <line x1="1125" y1="698" x2="1125" y2="744"/>
  </g>
  <!-- 步骤序号 -->
  <g font-size="14" font-weight="700">
    <circle cx="1148" cy="267" r="13" fill="#3b82f6"/><text x="1148" y="272" text-anchor="middle" fill="#fff">1</text>
    <circle cx="1148" cy="439" r="13" fill="#8b5cf6"/><text x="1148" y="444" text-anchor="middle" fill="#fff">3</text>
    <circle cx="1148" cy="587" r="13" fill="#6366f1"/><text x="1148" y="592" text-anchor="middle" fill="#fff">4</text>
    <circle cx="1148" cy="721" r="13" fill="#ef4444"/><text x="1148" y="726" text-anchor="middle" fill="#fff">5</text>
  </g>

  <!-- ===== 横向：读 / 写 与记忆存储交互 ===== -->
  <!-- ② 读取记忆：ai_context <- 记忆存储 -->
  <line x1="718" y1="354" x2="652" y2="354" stroke="#0ea5e9" stroke-width="2.6" marker-end="url(#arrowRead)"/>
  <circle cx="685" cy="330" r="13" fill="#0ea5e9"/><text x="685" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="660" y="312" text-anchor="end" font-size="13" font-weight="600" fill="#0369a1">读取记忆 read</text>

  <!-- ⑥ 写回记忆：写回校验 -> 记忆存储 -->
  <line x1="718" y1="806" x2="652" y2="806" stroke="#ef4444" stroke-width="2.6" marker-end="url(#arrowWrite)"/>
  <circle cx="685" cy="782" r="13" fill="#ef4444"/><text x="685" y="787" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
  <text x="660" y="838" text-anchor="end" font-size="13" font-weight="600" fill="#b91c1c">写回记忆 write</text>

  <!-- 返回可见回复（虚线，沿右侧回到入口） -->
  <path d="M1530 806 H1565 V192 H1532" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1578" y="500" font-size="12.5" fill="#64748b" transform="rotate(90 1578 500)" text-anchor="middle">剥离 MEMORY_OP 后返回可见回复</text>

  <!-- 底部图例 -->
  <g font-size="13" fill="#475569">
    <line x1="92" y1="892" x2="128" y2="892" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrowRead)"/>
    <text x="136" y="897">读链路（注入记忆）</text>
    <line x1="320" y1="892" x2="356" y2="892" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowWrite)"/>
    <text x="364" y="897">写链路（更新记忆）</text>
    <line x1="548" y1="892" x2="584" y2="892" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="592" y="897">可见回复返回</text>
    <text x="800" y="897" fill="#94a3b8">① 触发 → ② 读记忆 → ③ 组装直连 → ④ 模型 → ⑤ 解析 → ⑥ 写记忆 ↺</text>
  </g>
</svg>
